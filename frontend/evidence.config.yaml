appearance:
  default: system
  switcher: true

theme:
  colorPalettes:
    default:
      light:
        - "#1B4D89"  # Deep Ocean Blue
        - "#4B7F52"  # Forest Green
        - "#88B04B"  # Leaf Green
        - "#7CA5B8"  # Water Blue
        - "#C4B454"  # Wheat Gold
        - "#8B5E3C"  # Rich Soil Brown
        - "#3C8DAD"  # Lake Blue
        - "#6B8E23"  # Olive Green
        - "#4682B4"  # Steel Blue
        - "#556B2F"  # Dark Olive
      dark:
        - "#1B4D89"  # Deep Ocean Blue
        - "#4B7F52"  # Forest Green
        - "#88B04B"  # Leaf Green
        - "#7CA5B8"  # Water Blue
        - "#C4B454"  # Wheat Gold
        - "#8B5E3C"  # Rich Soil Brown
        - "#3C8DAD"  # Lake Blue
        - "#6B8E23"  # Olive Green
        - "#4682B4"  # Steel Blue
        - "#556B2F"  # Dark Olive
  colorScales:
    default:
      light:
        - "#B8D9E6"  # Light Sky
        - "#1B4D89"  # Deep Water
      dark:
        - "#B8D9E6"  # Light Sky
        - "#1B4D89"  # Deep Water
  colors:
    primary:
      light: "#4B7F52"  # Forest Green
      dark: "#88B04B"   # Leaf Green
    accent:
      light: "#1B4D89"  # Deep Ocean Blue
      dark: "#7CA5B8"   # Water Blue
    base:
      light: "#FFFFFF"  # Clean White
      dark: "#1A2F3B"   # Deep Sea Dark
    info:
      light: "#3C8DAD"  # Lake Blue
      dark: "#7CA5B8"   # Water Blue
    positive:
      light: "#4B7F52"  # Forest Green
      dark: "#88B04B"   # Leaf Green
    warning:
      light: "#C4B454"  # Wheat Gold
      dark: "#DAC05E"   # Light Wheat
    negative:
      light: "#8B4513"  # Saddle Brown
      dark: "#A0522D"   # Sienna

plugins:
  components:
    # This loads all of evidence's core charts and UI components
    # You probably don't want to edit this dependency unless you know what you are doing
    "@evidence-dev/core-components": {}

  datasources:
    # You can add additional datasources here by adding npm packages.
    # Make to also add them to `package.json`.
    "@evidence-dev/bigquery": { }
    "@evidence-dev/csv": { }
    "@evidence-dev/databricks": { }
    "@evidence-dev/duckdb": { }
    "@evidence-dev/mssql": { }
    "@evidence-dev/mysql": { }
    "@evidence-dev/postgres": { }
    "@evidence-dev/source-javascript": { }
    "@evidence-dev/snowflake": { }
    "@evidence-dev/sqlite": { }
    "@evidence-dev/trino": { }
    "@evidence-dev/motherduck": { }
